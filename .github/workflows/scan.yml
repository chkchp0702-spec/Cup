name: 컵앤핸들 매일 스캔

on:
  schedule:
    - cron: "20 20 * * 0-4"      # 한국시간 평일 05:20 (UTC+9)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas yfinance pykrx akshare openpyxl xlrd
      - name: 스크립트 생성
        run: |
          cat > scan.py << 'PYTHON_EOF'
          import os, time, math, warnings
          warnings.filterwarnings("ignore")
          import numpy as np, pandas as pd, yfinance as yf

          T0 = time.time()
          BUDGET = float(os.environ.get("TIME_BUDGET_MIN", "70"))
          TOPF = int(os.environ.get("TOP_FUND", "250"))
          os.makedirs("results", exist_ok=True)
          left = lambda: BUDGET - (time.time() - T0) / 60
          log = lambda m: print(f"[{(time.time()-T0)/60:5.1f}분] {m}", flush=True)

          # --- 컵앤핸들 검출 (오닐 기준) ---------------------------------------------
          P = dict(up=0.30, lb=250, dmin=35, dmax=325, depth_lo=.12, depth_hi=.50,
                   rim=.08, rnd=.18, rnd_bars=10, dec_lo=.20, dec_hi=.78, dec_days=15,
                   h_lo=5, h_hi=45, hd_lo=.03, hd_hi=.15, hvol=.90, buf=.001)


          def peaks(h, w=10):
              return [i for i in range(w, len(h) - w) if h[i] == h[i - w:i + w + 1].max()]


          def rs_score(c):
              if len(c) < 252:
                  return None
              r = lambda n: c[-1] / c[-n] - 1
              return float(2 * r(63) + r(126) + r(189) + r(252))


          def detect(df, tk, mkt, minp):
              if df is None or len(df) < 150:
                  return []
              df = df.dropna(subset=["high", "low", "close", "volume"])
              if len(df) < 150:
                  return []
              h, l, c, v = (df[x].to_numpy(float) for x in ("high", "low", "close", "volume"))
              n, dts, last = len(df), df.index, float(df["close"].iloc[-1])
              if last < minp:
                  return []
              v50 = float(np.nanmean(v[-50:]))
              rs = rs_score(c)

              for li in peaks(h)[::-1]:
                  if n - li < P["dmin"]:
                      continue
                  if n - li > P["dmax"] + P["h_hi"]:
                      break
                  lv = h[li]
                  lb = max(0, li - P["lb"])
                  if li - lb < 20 or lv / float(np.min(l[lb:li])) - 1 < P["up"]:
                      continue

                  se = min(n, li + P["dmax"] + 1)
                  if se - li < 12:
                      continue
                  bi = li + 1 + int(np.argmin(l[li + 1:se]))
                  bv = l[bi]
                  depth = 1 - bv / lv
                  if not (P["depth_lo"] <= depth <= P["depth_hi"]):
                      continue

                  touch = next((j for j in range(bi + 1, se) if h[j] >= lv * (1 - P["rim"])), None)
                  if touch is None:
                      continue
                  ri = touch + int(np.argmax(h[touch:min(n, touch + P["h_hi"] + 1)]))
                  if ri <= bi:
                      continue
                  cd = ri - li
                  if not (P["dmin"] <= cd <= P["dmax"]):
                      continue

                  # U자 검증 (V자 배제)
                  cc = c[li:ri + 1]
                  thr = bv + (lv - bv) * .33
                  rnd = float(np.mean(cc <= thr))
                  if rnd < P["rnd"] or int(rnd * len(cc)) < P["rnd_bars"]:
                      continue
                  dd = bi - li
                  if dd < P["dec_days"] or not (P["dec_lo"] <= dd / cd <= P["dec_hi"]):
                      continue

                  cav = float(np.nanmean(v[li:ri + 1]))
                  mid = bv + (lv - bv) * .5

                  # 손잡이
                  for he in range(min(n - 1, ri + P["h_hi"]), ri + P["h_lo"] - 1, -1):
                      sl = slice(ri, he + 1)
                      hh, hl = float(h[sl].max()), float(l[sl].min())
                      hd = 1 - hl / hh
                      if not (P["hd_lo"] <= hd <= P["hd_hi"]):
                          continue
                      if hl < mid:
                          continue
                      vr = float(np.nanmean(v[sl])) / cav if cav > 0 else 9
                      if vr > P["hvol"]:
                          continue
                      piv = hh * (1 + P["buf"])
                      d = last / piv - 1
                      return [dict(ticker=tk, market=mkt, name="", last=round(last, 2),
                                   pivot=round(piv, 2), dist=round(d * 100, 2),
                                   depth=round(depth * 100, 1), weeks=round(cd / 5, 1),
                                   hdepth=round(hd * 100, 1), hvol=round(vr, 2),
                                   actionable=bool(-.12 <= d <= .05), broke=bool(d > 0),
                                   bo_vol=round(v[-1] / v50, 2) if v50 else 0,
                                   rs_raw=rs, bottom=str(dts[bi].date()))]
              return []


          # --- 캔슬림 ----------------------------------------------------------------
          def yoy(s):
              if s is None or len(s) < 5:
                  return None
              a, b = s.iloc[0], s.iloc[4]
              if pd.isna(a) or pd.isna(b) or b == 0 or b < 0:
                  return None
              return float(a / b - 1)


          def cagr(s, y=3):
              if s is None or len(s) < y + 1:
                  return None
              a, b = s.iloc[0], s.iloc[y]
              if pd.isna(a) or pd.isna(b) or b <= 0 or a <= 0:
                  return None
              return float((a / b) ** (1 / y) - 1)


          def canslim(f, px, rs_pct, regime):
              g = {}
              e, s_ = yoy(f.get("qe")), yoy(f.get("qr"))
              g["C"] = "unknown" if e is None else (
                  "pass" if e >= .25 and (s_ is None or s_ >= .20) else "fail")

              cg, roe = cagr(f.get("ae")), f.get("roe")
              if cg is None and roe is None:
                  g["A"] = "unknown"
              else:
                  okc, okr = (cg is not None and cg >= .25), (roe is not None and roe >= .17)
                  g["A"] = "pass" if (cg is None or okc) and (roe is None or okr) \
                           and (okc or okr) else "fail"

              if px is not None and len(px) >= 60:
                  w = px["close"].tail(252)
                  off = 1 - float(w.iloc[-1]) / float(w.max())
                  g["N"] = "pass" if off <= .15 else "fail"
              else:
                  g["N"] = "unknown"

              sh = f.get("shares")
              g["S"] = "unknown" if not sh else ("pass" if sh <= 5e9 else "fail")
              g["L"] = "unknown" if rs_pct is None else ("pass" if rs_pct >= 80 else "fail")
              ip = f.get("inst")
              g["I"] = "unknown" if ip is None else ("pass" if .05 <= ip <= .95 else "fail")
              g["M"] = "unknown" if not regime else ("pass" if regime == "uptrend" else "fail")

              npass = sum(x == "pass" for x in g.values())
              req = all(g[k] == "pass" for k in "CALM")
              g["n_pass"] = npass
              g["verdict"] = "canslim" if (req and npass >= 5) else (
                  "fail" if any(g[k] == "fail" for k in "CALM") else "partial")
              return g


          # --- 종목 목록 -------------------------------------------------------------
          def u_hk():
              d = pd.read_excel("https://www.hkex.com.hk/eng/services/trading/securities/"
                                "securitieslists/ListOfSecurities.xlsx", skiprows=2)
              d.columns = [str(x).strip() for x in d.columns]
              cc = next(x for x in d.columns if "Stock Code" in x)
              cn = next(x for x in d.columns if "Name of Securities" in x)
              cg = next((x for x in d.columns if "Category" in x), None)
              o = []
              for _, r in d.iterrows():
                  try:
                      k = int(str(r[cc]).strip())
                  except Exception:
                      continue
                  if cg and "Equity" not in str(r[cg]):
                      continue
                  o.append((f"{k:04d}.HK", str(r[cn])[:28]))
              return o


          def u_kr():
              """
              pykrx 는 휴장일/주말에 빈 결과를 주며 IndexError 를 던진다.
              최근 10일을 거슬러 올라가며 데이터가 있는 날을 찾는다.
              종목명은 한 번에 받아온다 (종목별 호출은 2,700회라 너무 느림).
              """
              from pykrx import stock
              from datetime import datetime, timedelta
              err = None
              for back in range(12):
                  d = (datetime.now() - timedelta(days=back)).strftime("%Y%m%d")
                  try:
                      o = []
                      for m, sfx in [("KOSPI", ".KS"), ("KOSDAQ", ".KQ")]:
                          try:
                              ser = stock.get_market_ticker_and_name(d, market=m)
                              o += [(str(t) + sfx, str(n)) for t, n in ser.items()]
                          except Exception:
                              for t in stock.get_market_ticker_list(d, market=m):
                                  o.append((str(t) + sfx, str(t)))
                      if len(o) > 1000:
                          return o
                  except Exception as e:
                      err = e
              raise RuntimeError(f"최근 12일간 데이터 없음 ({type(err).__name__})")


          def u_jp():
              d = pd.read_excel("https://www.jpx.co.jp/markets/statistics-equities/misc/"
                                "tvdivq0000001vg2-att/data_j.xls")
              cc = next(x for x in d.columns if "コード" in str(x))
              cn = next(x for x in d.columns if "銘柄名" in str(x))
              cm = next((x for x in d.columns if "市場" in str(x)), None)
              o = []
              for _, r in d.iterrows():
                  try:
                      k = int(r[cc])
                  except Exception:
                      continue
                  if cm and "ETF" in str(r[cm]):
                      continue
                  o.append((f"{k}.T", str(r[cn])[:28]))
              return o


          def u_cn():
              """
              중국 데이터 서버는 해외 IP(깃허브 서버는 미국)를 자주 차단한다.
              여러 경로를 순서대로 시도하고 재시도한다.
              """
              import akshare as ak

              def pairs(df, cc, cn):
                  o = []
                  for _, r in df.iterrows():
                      c, n = str(r[cc]).strip()[:6], str(r[cn])[:20]
                      if not c.isdigit():
                          continue
                      if c.startswith("6"):
                          o.append((c + ".SS", n))
                      elif c.startswith(("0", "3")):
                          o.append((c + ".SZ", n))
                  return o

              routes = [
                  ("stock_info_a_code_name", lambda: ak.stock_info_a_code_name(), "code", "name"),
                  ("stock_zh_a_spot_em", lambda: ak.stock_zh_a_spot_em(), "代码", "名称"),
              ]
              err = None
              for attempt in range(2):
                  for nm, fn, cc, cn in routes:
                      try:
                          df = fn()
                          o = pairs(df, cc, cn)
                          if len(o) > 1000:
                              return o
                          err = ValueError(f"{nm}: {len(o)}개뿐")
                      except Exception as e:
                          err = e
                  time.sleep(5)
              raise RuntimeError(f"중국 서버 접속 실패 ({type(err).__name__})")


          def u_us():
              o = []
              for u, a, b in [("https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt",
                               "Symbol", "Security Name"),
                              ("https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt",
                               "ACT Symbol", "Security Name")]:
                  d = pd.read_csv(u, sep="|")
                  for _, r in d[d[a].notna()].iterrows():
                      s, n = str(r[a]).strip(), str(r.get(b, ""))[:38]
                      if not s or "File Creation" in s or "test" in n.lower():
                          continue
                      if any(ch in s for ch in "$."):
                          continue
                      if str(r.get("ETF", "N")).strip().upper() == "Y":
                          continue                      # ETF 제외
                      if str(r.get("Test Issue", "N")).strip().upper() == "Y":
                          continue                      # 테스트 종목 제외
                      o.append((s, n))
              return o


          MKT = [("홍콩", "HK", u_hk, "^HSI", 3), ("한국", "KR", u_kr, "^KS11", 5000),
                 ("일본", "JP", u_jp, "^N225", 500), ("중국", "CN", u_cn, "000001.SS", 5),
                 ("미국", "US", u_us, "^GSPC", 5)]
          LBL = {"uptrend": "상승장", "downtrend": "하락장", "neutral": "횡보장", "": "판정불가"}


          def regime(sym):
              try:
                  b = yf.Ticker(sym).history(period="2y", auto_adjust=False)["Close"]
                  if len(b) < 200:
                      return ""
                  c, a, d = b.iloc[-1], b.rolling(50).mean().iloc[-1], b.rolling(200).mean().iloc[-1]
                  return "uptrend" if c > a > d else ("downtrend" if c < d else "neutral")
              except Exception:
                  return ""


          # --- 스캔 ------------------------------------------------------------------
          rows, REG, stats, cut = [], {}, [], False
          for nm, code, fn, bench, minp in MKT:
              if left() < 6:
                  cut = True
                  log(f"시간 부족 — {nm} 이후 생략")
                  break
              log(f"{nm} 목록 수집")
              try:
                  uni = fn()
              except Exception as e:
                  stats.append((nm, 0, 0, f"목록 실패({type(e).__name__})"))
                  log(f"  실패 — 건너뜀")
                  continue
              REG[code] = regime(bench)
              log(f"  {len(uni):,}종목 / {LBL[REG[code]]}")
              f0, nd = len(rows), 0
              for ci in range(math.ceil(len(uni) / 200)):
                  if left() < 3:
                      cut = True
                      break
                  part = uni[ci * 200:(ci + 1) * 200]
                  syms = [p[0] for p in part]
                  meta = dict(part)
                  try:
                      data = yf.download(syms, period="2y", group_by="ticker",
                                         auto_adjust=False, threads=True, progress=False)
                  except Exception:
                      nd += len(syms)
                      continue
                  for tk in syms:
                      try:
                          d = data[tk] if isinstance(data.columns, pd.MultiIndex) else data
                          d = d.dropna(how="all").rename(columns=str.lower)
                          if len(d) < 150:
                              nd += 1
                              continue
                          for m in detect(d, tk, code, minp):
                              m["name"] = meta[tk]
                              rows.append(m)
                      except Exception:
                          nd += 1
              stats.append((nm, len(uni), len(rows) - f0,
                            "정상" if nd < len(uni) * .5 else f"조회실패 {nd:,}"))
              log(f"  {nm} 완료 — {len(rows)-f0}건")

          res = pd.DataFrame(rows)
          log(f"스캔 종료 — {len(res)}건")

          l1 = l2 = pd.DataFrame()
          if len(res):
              res["rs_pct"] = (res["rs_raw"].rank(pct=True) * 98 + 1).round(0) \
                  if res["rs_raw"].notna().any() else np.nan
              res = res.sort_values(["actionable", "depth"], ascending=[False, True])
              res = res.drop_duplicates("ticker").reset_index(drop=True)
              l1 = res[["name", "ticker", "market", "last", "pivot", "dist", "depth",
                        "weeks", "hdepth", "actionable", "broke", "rs_pct"]]
              l1.columns = ["종목명", "코드", "시장", "현재가", "매수기준가", "기준가까지%",
                            "컵깊이%", "컵기간주", "손잡이%", "매수권", "돌파", "상대강도"]
              l1.to_csv("results/list1_cup.csv", index=False, encoding="utf-8-sig")

              def row(d, keys):
                  if d is None or len(d) == 0:
                      return None
                  ix = {str(x).strip().lower(): x for x in d.index}
                  for k in keys:
                      if ix.get(k.lower()) is not None:
                          s = d.loc[ix[k.lower()]]
                          return pd.to_numeric(s.iloc[0] if isinstance(s, pd.DataFrame) else s,
                                               errors="coerce")
                  return None

              cand = res.head(TOPF)
              log(f"캔슬림 확인 {len(cand)}종목 (남은 {left():.0f}분)")
              gs = []
              for _, r in cand.iterrows():
                  if left() < 2:
                      cut = True
                      break
                  f, px = {}, None
                  try:
                      t = yf.Ticker(r["ticker"])
                      px = t.history(period="2y", auto_adjust=False).rename(columns=str.lower)
                      q, a = t.quarterly_income_stmt, t.income_stmt
                      f["qe"] = row(q, ["Diluted EPS", "Basic EPS"]) or row(q, ["Net Income"])
                      f["qr"] = row(q, ["Total Revenue", "Operating Revenue"])
                      f["ae"] = row(a, ["Diluted EPS", "Basic EPS"]) or row(a, ["Net Income"])
                      i = t.info or {}
                      f["roe"] = i.get("returnOnEquity")
                      f["shares"] = i.get("floatShares") or i.get("sharesOutstanding")
                      f["inst"] = i.get("heldPercentInstitutions")
                  except Exception:
                      pass
                  g = canslim(f, px, r.get("rs_pct"), REG.get(r["market"], ""))
                  g.update(name=r["name"], ticker=r["ticker"], market=r["market"],
                           last=r["last"], pivot=r["pivot"], dist=r["dist"])
                  gs.append(g)
              if gs:
                  gdf = pd.DataFrame(gs)
                  gdf.to_csv("results/list2_canslim_full.csv", index=False, encoding="utf-8-sig")
                  l2 = gdf[gdf["verdict"] == "canslim"]
          log(f"캔슬림 통과 {len(l2)}건")


          # --- 보고서 ----------------------------------------------------------------
          def tbl(d, cols, hdr, n=80):
              if d is None or len(d) == 0:
                  return "_해당 없음_\n"
              o = "| " + " | ".join(hdr) + " |\n|" + "|".join(["---"] * len(hdr)) + "|\n"
              for _, r in d[cols].head(n).iterrows():
                  o += "| " + " | ".join(
                      f"{r[c]:,.2f}" if isinstance(r[c], float) else str(r[c])
                      for c in cols) + " |\n"
              return o


          stamp = time.strftime("%Y-%m-%d (%a)", time.gmtime(time.time() + 32400))
          md = [f"# 컵앤핸들 리스트 — {stamp}\n", "## 시장 상황\n", "| 나라 | 국면 |", "|---|---|"]
          for nm, code, *_ in MKT:
              if code in REG:
                  md.append(f"| {nm} | {LBL[REG[code]]} |")
          md += ["", "## 스캔 결과\n", "| 나라 | 조회 | 발견 | 비고 |", "|---|---|---|---|"]
          for a, b, c, d in stats:
              md.append(f"| {a} | {b:,} | {c} | {d} |")

          act = l1[l1["매수권"] == True] if len(l1) else pd.DataFrame()  # noqa: E712
          show = act if len(act) else l1
          C = ["종목명", "코드", "시장", "현재가", "매수기준가", "기준가까지%", "컵깊이%"]
          md += ["", f"\n## 리스트 1 — 컵 모양 {len(l1)}개 "
                     f"(매수 기준가 근처 {len(act)}개)\n",
                 f"_아래는 매수 기준가에 가까운 순으로 최대 80개입니다. "
                 f"전체 {len(l1)}개는 results/list1_cup.csv 에 있습니다._\n",
                 tbl(show.sort_values("기준가까지%", key=abs) if len(show) else show, C, C)]

          md.append(f"\n## 리스트 2 — 캔슬림 통과 {len(l2)}개\n")
          if len(l2):
              md.append(tbl(l2, ["name", "ticker", "market", "last", "pivot",
                                 "C", "A", "N", "S", "L", "I", "M"],
                            ["종목명", "코드", "시장", "현재가", "매수기준가",
                             "C", "A", "N", "S", "L", "I", "M"]))
          else:
              md.append("_통과 종목 없음._ 캔슬림 전 항목 통과는 원래 드뭅니다. "
                        "하락장이면 M 규칙 때문에 전부 탈락합니다.\n")

          if cut:
              md.append("\n> ⚠ 시간 제한으로 일부만 처리했습니다.\n")
          md.append(f"\n---\n소요 {(time.time()-T0)/60:.0f}분 · 전체 목록은 results 폴더\n")
          md.append("\n※ 후보 목록이며 매수 추천이 아닙니다. 판단과 책임은 본인에게 있습니다.\n")
          body = "\n".join(md)
          if len(body) > 60000:
              body = body[:59000] + "\n\n> 내용이 길어 잘렸습니다. 전체는 results 폴더의 csv 참고.\n"
          open("summary.md", "w", encoding="utf-8").write(body)
          log(f"보고서 완료 ({len(body):,}자)")
          PYTHON_EOF
      - name: 스캔
        env:
          TIME_BUDGET_MIN: "70"
          TOP_FUND: "250"
        run: python scan.py
      - name: 결과 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "컵앤핸들 $(TZ=Asia/Seoul date '+%m/%d')" --body-file summary.md --repo "${{ github.repository }}"
      - name: 파일 저장
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A results summary.md
          git diff --staged --quiet || git commit -m "결과 $(TZ=Asia/Seoul date '+%m/%d')"
          git push
