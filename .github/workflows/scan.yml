name: 컵앤핸들 매일 스캔

on:
  schedule:
    - cron: "0 20 * * 0-4"       # 한국시간 평일 05:00 (UTC+9)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PDF 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wkhtmltopdf fonts-noto-cjk

      - run: pip install -q numpy pandas yfinance pykrx finance-datareader akshare openpyxl xlrd lxml html5lib

      - name: 스크립트 생성
        run: |
          cat > scan.py << 'PYTHON_EOF'
          import os, time, math, signal, warnings
          warnings.filterwarnings("ignore")
          import numpy as np, pandas as pd, yfinance as yf

          T0 = time.time()


          class Deadline(Exception):
              pass


          def _alarm(signum, frame):
              raise Deadline()


          signal.signal(signal.SIGALRM, _alarm)


          def set_deadline(minutes):
              """조회 한 건이 응답 없이 매달려도 강제로 빠져나오게 한다."""
              signal.alarm(max(1, int(minutes * 60)))


          def clear_deadline():
              signal.alarm(0)

          BUDGET = float(os.environ.get("TIME_BUDGET_MIN", "70"))
          TOPF = int(os.environ.get("TOP_FUND", "250"))
          os.makedirs("results", exist_ok=True)
          left = lambda: BUDGET - (time.time() - T0) / 60
          log = lambda m: print(f"[{(time.time()-T0)/60:5.1f}분] {m}", flush=True)

          # --- 컵앤핸들 검출 (오닐 기준) ---------------------------------------------
          P = dict(up=0.30, lb=250, dmin=35, dmax=325, depth_lo=.12, depth_hi=.50,
                   rim=.08, rnd=.18, rnd_bars=10, dec_lo=.20, dec_hi=.78, dec_days=15,
                   h_lo=5, h_hi=45, hd_lo=.03, hd_hi=.15, hvol=.90, buf=.001,
                   # --- 신고가 조건 (오닐 N: 신고가 부근에서 신뢰도가 높다) ---
                   piv52_max=0.15,    # 1차 스크린: 피봇이 52주 고점 -15% 밖이면 탈락
                   ath_piv_max=0.10,  # ★목록: 손잡이 고점이 사상최고가 -10% 이내
                   ath_over_max=0.05, # ★목록: 현재가가 사상최고가 +5% 이내
                   list1_ath_max=0.25,# 리스트1: 피봇이 사상최고가 -25% 밖이면 제외
                   min_bars_2y=400)   # 이보다 짧으면 신규상장으로 보고 ★목록 제외


          def peaks(h, w=10):
              return [i for i in range(w, len(h) - w) if h[i] == h[i - w:i + w + 1].max()]


          def rs_score(c):
              if len(c) < 252:
                  return None
              r = lambda n: c[-1] / c[-n] - 1
              return float(2 * r(63) + r(126) + r(189) + r(252))


          def detect(df, tk, mkt, minp):
              if df is None or len(df) < 150:
                  return []
              df = df.dropna(subset=["high", "low", "close", "volume"])
              if len(df) < 150:
                  return []
              h, l, c, v = (df[x].to_numpy(float) for x in ("high", "low", "close", "volume"))
              n, dts, last = len(df), df.index, float(df["close"].iloc[-1])
              if last < minp:
                  return []
              v50 = float(np.nanmean(v[-50:]))
              rs = rs_score(c)

              for li in peaks(h)[::-1]:
                  if n - li < P["dmin"]:
                      continue
                  if n - li > P["dmax"] + P["h_hi"]:
                      break
                  lv = h[li]
                  lb = max(0, li - P["lb"])
                  if li - lb < 20 or lv / float(np.min(l[lb:li])) - 1 < P["up"]:
                      continue

                  se = min(n, li + P["dmax"] + 1)
                  if se - li < 12:
                      continue
                  bi = li + 1 + int(np.argmin(l[li + 1:se]))
                  bv = l[bi]
                  depth = 1 - bv / lv
                  if not (P["depth_lo"] <= depth <= P["depth_hi"]):
                      continue

                  touch = next((j for j in range(bi + 1, se) if h[j] >= lv * (1 - P["rim"])), None)
                  if touch is None:
                      continue

                  # 우측 rim = 회복 후 첫 고점. 여기서 3% 이상 밀리면 손잡이 시작으로 본다.
                  # (돌파 봉을 rim 으로 잘못 잡지 않도록 '되밀림'을 확인한다)
                  ri, peak = None, touch
                  for j in range(touch, min(n, touch + P["h_hi"] + 1)):
                      if h[j] > h[peak]:
                          peak = j
                      if j > peak and l[j] <= h[peak] * (1 - P["hd_lo"]):
                          ri = peak
                          break
                  if ri is None or ri <= bi:
                      continue

                  cd = ri - li
                  if not (P["dmin"] <= cd <= P["dmax"]):
                      continue

                  # U자 검증 (V자 배제)
                  cc = c[li:ri + 1]
                  thr = bv + (lv - bv) * .33
                  rnd = float(np.mean(cc <= thr))
                  if rnd < P["rnd"] or int(rnd * len(cc)) < P["rnd_bars"]:
                      continue
                  dd = bi - li
                  if dd < P["dec_days"] or not (P["dec_lo"] <= dd / cd <= P["dec_hi"]):
                      continue

                  cav = float(np.nanmean(v[li:ri + 1]))
                  mid = bv + (lv - bv) * .5
                  piv = h[ri] * (1 + P["buf"])

                  # 돌파일 = rim 이후 처음으로 피봇 위에서 마감한 날
                  bo_i = next((j for j in range(ri + 1, n) if c[j] > piv), None)
                  he = (bo_i - 1) if bo_i is not None else (n - 1)
                  hdays = he - ri
                  if not (P["h_lo"] <= hdays <= P["h_hi"]):
                      continue

                  hl = float(np.min(l[ri:he + 1]))
                  hd = 1 - hl / h[ri]
                  if not (P["hd_lo"] <= hd <= P["hd_hi"]):
                      continue
                  if hl < mid:
                      continue
                  vr = float(np.nanmean(v[ri:he + 1])) / cav if cav > 0 else 9
                  if vr > P["hvol"]:
                      continue

                  d = last / piv - 1
                  if bo_i is None:
                      days_bo, bo_v, bo_date = None, 0.0, ""
                  else:
                      days_bo = n - 1 - bo_i
                      base = float(np.nanmean(v[max(0, bo_i - 50):bo_i])) or v50
                      bo_v = round(v[bo_i] / base, 2) if base else 0.0
                      bo_date = str(dts[bo_i].date())

                  # --- 신고가 조건 (오닐 N) ---
                  bars = n
                  newly = bars < P["min_bars_2y"]
                  hi52 = float(np.max(h[-252:])) if n >= 252 else float(np.max(h))
                  hi2y = float(np.max(h))
                  off52 = (1 - last / hi52) if hi52 > 0 else 1.0
                  off2y = (1 - last / hi2y) if hi2y > 0 else 1.0
                  piv52 = (1 - piv / hi52) if hi52 > 0 else 1.0

                  # 후발주 배제: 피봇 자체가 52주 고점에서 멀면 컵이라도 버린다
                  if piv52 > P["piv52_max"]:
                      continue

                  # 사상최고가 판정은 전체 상장 이력이 필요해 2단계에서 한다.
                  fresh_raw = bool(bo_i is not None and days_bo <= 5 and bo_v >= 1.4)

                  return [dict(ticker=tk, market=mkt, name="", last=round(last, 2),
                               pivot=round(piv, 2), dist=round(d * 100, 2),
                               depth=round(depth * 100, 1), weeks=round(cd / 5, 1),
                               hdepth=round(hd * 100, 1), hvol=round(vr, 2),
                               hdays=hdays,
                               actionable=bool(-.12 <= d <= .05), broke=bool(bo_i is not None),
                               fresh_raw=fresh_raw, days_bo=days_bo, bo_date=bo_date,
                               bo_vol=bo_v,
                               off52=round(off52 * 100, 1), off2=round(off2y * 100, 1),
                               piv52=round(piv52 * 100, 1),
                               newly=newly, bars=bars,
                               rs_raw=rs, bottom=str(dts[bi].date()))]

              return []


          # --- 캔슬림 ----------------------------------------------------------------
          def yoy(s):
              if s is None or len(s) < 5:
                  return None
              a, b = s.iloc[0], s.iloc[4]
              if pd.isna(a) or pd.isna(b) or b == 0 or b < 0:
                  return None
              return float(a / b - 1)


          def cagr(s, y=3):
              if s is None or len(s) < y + 1:
                  return None
              a, b = s.iloc[0], s.iloc[y]
              if pd.isna(a) or pd.isna(b) or b <= 0 or a <= 0:
                  return None
              return float((a / b) ** (1 / y) - 1)


          def canslim(f, px, rs_pct, regime):
              g = {}
              e, s_ = yoy(f.get("qe")), yoy(f.get("qr"))
              g["C"] = "unknown" if e is None else (
                  "pass" if e >= .25 and (s_ is None or s_ >= .20) else "fail")

              cg, roe = cagr(f.get("ae")), f.get("roe")
              if cg is None and roe is None:
                  g["A"] = "unknown"
              else:
                  okc, okr = (cg is not None and cg >= .25), (roe is not None and roe >= .17)
                  g["A"] = "pass" if (cg is None or okc) and (roe is None or okr) \
                           and (okc or okr) else "fail"

              if px is not None and len(px) >= 60:
                  w = px["close"].tail(252)
                  off = 1 - float(w.iloc[-1]) / float(w.max())
                  g["N"] = "pass" if off <= .15 else "fail"
              else:
                  g["N"] = "unknown"

              sh = f.get("shares")
              g["S"] = "unknown" if not sh else ("pass" if sh <= 5e9 else "fail")
              g["L"] = "unknown" if rs_pct is None else ("pass" if rs_pct >= 80 else "fail")
              ip = f.get("inst")
              g["I"] = "unknown" if ip is None else ("pass" if .05 <= ip <= .95 else "fail")
              g["M"] = "unknown" if not regime else ("pass" if regime == "uptrend" else "fail")

              npass = sum(x == "pass" for x in g.values())
              req = all(g[k] == "pass" for k in "CALM")
              g["n_pass"] = npass
              g["verdict"] = "canslim" if (req and npass >= 5) else (
                  "fail" if any(g[k] == "fail" for k in "CALM") else "partial")
              return g


          # --- 종목 목록 -------------------------------------------------------------
          def u_hk():
              d = pd.read_excel("https://www.hkex.com.hk/eng/services/trading/securities/"
                                "securitieslists/ListOfSecurities.xlsx", skiprows=2)
              d.columns = [str(x).strip() for x in d.columns]
              cc = next(x for x in d.columns if "Stock Code" in x)
              cn = next(x for x in d.columns if "Name of Securities" in x)
              cg = next((x for x in d.columns if "Category" in x), None)
              o = []
              for _, r in d.iterrows():
                  try:
                      k = int(str(r[cc]).strip())
                  except Exception:
                      continue
                  if cg and "Equity" not in str(r[cg]):
                      continue
                  o.append((f"{k:04d}.HK", str(r[cn])[:28]))
              return o


          def u_kr():
              """
              한국 종목 목록. 경로를 여러 개 준비한다.
                1순위 FinanceDataReader — KRX 와 다른 경로를 쓴다
                2순위 pykrx — 휴장일 대비로 최근 12일을 훑는다
                3순위 네이버 상장목록
              실패 사유를 그대로 남겨서 다음에 원인을 알 수 있게 한다.
              """
              errs = []

              # 1) FinanceDataReader
              try:
                  import FinanceDataReader as fdr
                  df = fdr.StockListing("KRX")
                  cc = next((c for c in ("Code", "Symbol", "종목코드") if c in df.columns), None)
                  cn = next((c for c in ("Name", "종목명") if c in df.columns), None)
                  mk = next((c for c in ("Market", "시장구분") if c in df.columns), None)
                  if cc:
                      o = []
                      for _, r in df.iterrows():
                          c = str(r[cc]).strip().zfill(6)
                          if not c.isdigit() or len(c) != 6:
                              continue
                          m = str(r[mk]).upper() if mk else ""
                          if "KONEX" in m:
                              continue
                          sfx = ".KQ" if "KOSDAQ" in m else ".KS"
                          o.append((c + sfx, str(r[cn])[:20] if cn else c))
                      if len(o) > 1000:
                          print(f"    (한국: FinanceDataReader 성공 {len(o)}개)", flush=True)
                          return o
                      errs.append(f"fdr:{len(o)}개뿐")
              except Exception as e:
                  errs.append(f"fdr:{type(e).__name__}")

              # 2) pykrx
              try:
                  from pykrx import stock
                  from datetime import datetime, timedelta
                  for back in range(12):
                      d = (datetime.now() - timedelta(days=back)).strftime("%Y%m%d")
                      try:
                          o = []
                          for m, sfx in [("KOSPI", ".KS"), ("KOSDAQ", ".KQ")]:
                              try:
                                  ser = stock.get_market_ticker_and_name(d, market=m)
                                  o += [(str(t) + sfx, str(n)) for t, n in ser.items()]
                              except Exception:
                                  for t in stock.get_market_ticker_list(d, market=m):
                                      o.append((str(t) + sfx, str(t)))
                          if len(o) > 1000:
                              print(f"    (한국: pykrx 성공 {len(o)}개, {d})", flush=True)
                              return o
                      except Exception as e:
                          last = f"pykrx:{type(e).__name__}"
                  errs.append(last if "last" in dir() else "pykrx:빈결과")
              except Exception as e:
                  errs.append(f"pykrx:{type(e).__name__}")

              # 3) 네이버 상장목록
              try:
                  frames = []
                  for mkt, sfx in [(0, ".KS"), (1, ".KQ")]:
                      u = ("https://kind.krx.co.kr/corpgeneral/corpList.do"
                           f"?method=download&marketType={'stockMkt' if mkt==0 else 'kosdaqMkt'}")
                      t = pd.read_html(u, encoding="euc-kr")[0]
                      cc = next(c for c in t.columns if "종목코드" in str(c))
                      cn = next(c for c in t.columns if "회사명" in str(c))
                      for _, r in t.iterrows():
                          c = str(int(r[cc])).zfill(6)
                          frames.append((c + sfx, str(r[cn])[:20]))
                  if len(frames) > 1000:
                      print(f"    (한국: KIND 성공 {len(frames)}개)", flush=True)
                      return frames
                  errs.append(f"kind:{len(frames)}개뿐")
              except Exception as e:
                  errs.append(f"kind:{type(e).__name__}")

              raise RuntimeError(" / ".join(errs))


          def u_jp():
              d = pd.read_excel("https://www.jpx.co.jp/markets/statistics-equities/misc/"
                                "tvdivq0000001vg2-att/data_j.xls")
              cc = next(x for x in d.columns if "コード" in str(x))
              cn = next(x for x in d.columns if "銘柄名" in str(x))
              cm = next((x for x in d.columns if "市場" in str(x)), None)
              o = []
              for _, r in d.iterrows():
                  try:
                      k = int(r[cc])
                  except Exception:
                      continue
                  if cm and "ETF" in str(r[cm]):
                      continue
                  o.append((f"{k}.T", str(r[cn])[:28]))
              return o


          def u_cn():
              """
              중국 A주 종목 목록.

              1순위: akshare (중국 서버) — 종목명까지 정확하지만 해외 IP를 자주 차단
              2순위: 코드 대역 직접 생성 — 중국 서버를 안 거치므로 차단과 무관
                      A주 코드는 정해진 대역 안에만 존재한다. 없는 코드는
                      시세 조회에서 자동으로 걸러지므로 결과에 영향이 없다.
              """
              import akshare as ak

              def pairs(df, cc, cn):
                  o = []
                  for _, r in df.iterrows():
                      c, n = str(r[cc]).strip()[:6], str(r[cn])[:20]
                      if not c.isdigit():
                          continue
                      if c.startswith("6"):
                          o.append((c + ".SS", n))
                      elif c.startswith(("0", "3")):
                          o.append((c + ".SZ", n))
                  return o

              routes = [("eastmoney_code_name",
                         lambda: ak.stock_info_a_code_name(), "code", "name"),
                        ("eastmoney_spot",
                         lambda: ak.stock_zh_a_spot_em(), "代码", "名称"),
                        ("sina_spot",
                         lambda: ak.stock_zh_a_spot(), "代码", "名称")]
              # 중국 서버는 간헐적으로 막힌다. 넉넉히 재시도한다.
              for attempt in range(4):
                  for nm, fn, cc, cn in routes:
                      try:
                          o = pairs(fn(), cc, cn)
                          if len(o) > 1000:
                              print(f"    (중국: {nm} 성공 {len(o)}개)", flush=True)
                              return o
                      except Exception:
                          pass
                  if attempt < 3:
                      time.sleep(20)

              # --- 대체 경로: 코드 대역 생성 ---
              print("    (중국 서버 차단 — 코드 대역 생성으로 전환)", flush=True)
              o = []
              for lo, hi in [(600000, 601000), (601000, 601900), (603000, 603900),
                             (605000, 605600), (688000, 688900)]:
                  o += [(f"{c}.SS", f"SH{c}") for c in range(lo, hi)]
              for lo, hi in [(1, 1000), (2000, 3100), (300000, 301700)]:
                  o += [(f"{c:06d}.SZ", f"SZ{c:06d}") for c in range(lo, hi)]
              return o


          def u_us():
              o = []
              for u, a, b in [("https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt",
                               "Symbol", "Security Name"),
                              ("https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt",
                               "ACT Symbol", "Security Name")]:
                  d = pd.read_csv(u, sep="|")
                  for _, r in d[d[a].notna()].iterrows():
                      s, n = str(r[a]).strip(), str(r.get(b, ""))[:38]
                      if not s or "File Creation" in s or "test" in n.lower():
                          continue
                      if any(ch in s for ch in "$."):
                          continue
                      if str(r.get("ETF", "N")).strip().upper() == "Y":
                          continue                      # ETF 제외
                      if str(r.get("Test Issue", "N")).strip().upper() == "Y":
                          continue                      # 테스트 종목 제외
                      o.append((s, n))
              return o


          MKT = [("홍콩", "HK", u_hk, "^HSI", 3), ("한국", "KR", u_kr, "^KS11", 5000),
                 ("일본", "JP", u_jp, "^N225", 500), ("중국", "CN", u_cn, "000001.SS", 5),
                 ("미국", "US", u_us, "^GSPC", 5)]
          LBL = {"uptrend": "상승장", "downtrend": "하락장", "neutral": "횡보장", "": "판정불가"}


          def regime(sym):
              try:
                  b = yf.Ticker(sym).history(period="2y", auto_adjust=False)["Close"]
                  if len(b) < 200:
                      return ""
                  c, a, d = b.iloc[-1], b.rolling(50).mean().iloc[-1], b.rolling(200).mean().iloc[-1]
                  return "uptrend" if c > a > d else ("downtrend" if c < d else "neutral")
              except Exception:
                  return ""


          # --- 스캔 ------------------------------------------------------------------
          rows, REG, stats, cut = [], {}, [], False
          set_deadline(BUDGET * 0.80)          # 스캔에 예산의 80%까지만
          try:
            for nm, code, fn, bench, minp in MKT:
                if left() < 6:
                    cut = True
                    log(f"시간 부족 — {nm} 이후 생략")
                    break
                log(f"{nm} 목록 수집")
                try:
                    uni = fn()
                except Exception as e:
                    stats.append((nm, 0, 0, f"목록 실패({type(e).__name__})"))
                    log(f"  실패 — 건너뜀")
                    continue
                REG[code] = regime(bench)
                log(f"  {len(uni):,}종목 / {LBL[REG[code]]}")
                f0, nd = len(rows), 0
                for ci in range(math.ceil(len(uni) / 200)):
                    if left() < 3:
                        cut = True
                        break
                    part = uni[ci * 200:(ci + 1) * 200]
                    syms = [p[0] for p in part]
                    meta = dict(part)
                    try:
                        data = yf.download(syms, period="2y", group_by="ticker",
                                           auto_adjust=False, threads=True, progress=False)
                    except Exception:
                        nd += len(syms)
                        continue
                    for tk in syms:
                        try:
                            d = data[tk] if isinstance(data.columns, pd.MultiIndex) else data
                            d = d.dropna(how="all").rename(columns=str.lower)
                            if len(d) < 150:
                                nd += 1
                                continue
                            for m in detect(d, tk, code, minp):
                                m["name"] = meta[tk]
                                rows.append(m)
                        except Exception:
                            nd += 1
                note = "정상"
                if cut:
                    note = "시간부족 부분처리"
                elif nd > len(uni) * .5:
                    note = f"조회실패 {nd:,}"
                stats.append((nm, len(uni), len(rows) - f0, note))
                log(f"  {nm} 완료 — {len(rows)-f0}건")
          except Deadline:
              cut = True
              print("  [강제마감] 조회가 응답하지 않아 스캔을 중단합니다", flush=True)
          finally:
              clear_deadline()

          res = pd.DataFrame(rows)
          log(f"스캔 종료 — {len(res)}건")

          SEC, IND = {}, {}
          SECTOR_KR = {
              "Technology": "기술·IT", "Healthcare": "헬스케어",
              "Financial Services": "금융", "Consumer Cyclical": "경기소비재",
              "Consumer Defensive": "필수소비재", "Industrials": "산업재",
              "Energy": "에너지", "Basic Materials": "소재",
              "Real Estate": "부동산", "Utilities": "유틸리티",
              "Communication Services": "통신·미디어",
          }

          l1 = l2 = pd.DataFrame()
          if len(res):
              res["rs_pct"] = (res["rs_raw"].rank(pct=True) * 98 + 1).round(0) \
                  if res["rs_raw"].notna().any() else np.nan
              res = res.drop_duplicates("ticker").reset_index(drop=True)

              # ---------------- 2단계: 사상최고가 확인 ----------------
              # 전체 상장 이력은 무거우므로 1차로 걸러진 종목만 받는다.
              log(f"사상최고가 확인 {len(res)}종목")
              ath = {}
              set_deadline(max(2, left() * 0.4))
              try:
                  tks = res["ticker"].tolist()
                  for i in range(0, len(tks), 50):
                      part = tks[i:i + 50]
                      try:
                          dd = yf.download(part, period="max", group_by="ticker",
                                           auto_adjust=False, threads=True, progress=False)
                      except Exception:
                          continue
                      for tk in part:
                          try:
                              x = dd[tk] if isinstance(dd.columns, pd.MultiIndex) else dd
                              x = x.dropna(how="all").rename(columns=str.lower)
                              if len(x) >= 60:
                                  ath[tk] = float(x["high"].max())
                          except Exception:
                              pass
              except Deadline:
                  cut = True
                  print("  [강제마감] 사상최고가 조회 중단", flush=True)
              finally:
                  clear_deadline()

              def _ath(r):
                  hi = ath.get(r["ticker"])
                  if not hi or hi <= 0:
                      return pd.Series([np.nan, np.nan, np.nan, False])
                  piv_off = (1 - r["pivot"] / hi) * 100
                  over = (r["last"] / hi - 1) * 100
                  ok = bool(piv_off <= P["ath_piv_max"] * 100
                            and over <= P["ath_over_max"] * 100
                            and not r["newly"])
                  return pd.Series([round(hi, 2), round(piv_off, 1), round(over, 1), ok])

              res[["ath", "ath_piv_off", "ath_over", "ath_ok"]] = res.apply(_ath, axis=1)
              res["fresh"] = res["fresh_raw"] & res["ath_ok"]
              log(f"  이력 조회 성공 {len(ath)} / 사상최고가 조건 충족 "
                  f"{int(res['ath_ok'].sum())}")

              # 리스트1 에서도 사상최고가에서 너무 멀면 제외 (후발주)
              lim = P["list1_ath_max"] * 100
              before = len(res)
              keep = res["ath_piv_off"].isna() | (res["ath_piv_off"] <= lim)
              dropped = int((~keep).sum())
              res = res[keep].reset_index(drop=True)
              if dropped:
                  log(f"  사상최고가 -{lim:.0f}% 밖이라 제외 {dropped}종목 "
                      f"({before} → {len(res)})")

              res = res.sort_values(["fresh", "actionable", "ath_piv_off"],
                                    ascending=[False, False, True]).reset_index(drop=True)
              l1 = res[["name", "ticker", "market", "last", "pivot", "dist", "depth",
                        "weeks", "hdepth", "actionable", "broke", "fresh", "days_bo",
                        "bo_date", "bo_vol", "ath", "ath_piv_off", "ath_over",
                        "off52", "newly", "rs_pct"]]
              l1.columns = ["종목명", "코드", "시장", "현재가", "매수기준가", "기준가까지%",
                            "컵깊이%", "컵기간주", "손잡이%", "매수권", "돌파", "막돌파",
                            "돌파후일수", "돌파일", "돌파거래량", "사상최고가",
                            "피봇_최고가대비%", "현재가_최고가대비%",
                            "52주고점대비%", "신규상장", "상대강도"]

              l1.to_csv("results/list1_cup.csv", index=False, encoding="utf-8-sig")
              l1[l1["막돌파"] == True].to_csv("results/list0_ath_breakout.csv",  # noqa: E712
                                             index=False, encoding="utf-8-sig")

              def row(d, keys):
                  if d is None or len(d) == 0:
                      return None
                  ix = {str(x).strip().lower(): x for x in d.index}
                  for k in keys:
                      if ix.get(k.lower()) is not None:
                          s = d.loc[ix[k.lower()]]
                          return pd.to_numeric(s.iloc[0] if isinstance(s, pd.DataFrame) else s,
                                               errors="coerce")
                  return None

              cand = res.head(TOPF)
              log(f"캔슬림 확인 {len(cand)}종목 (남은 {left():.0f}분)")
              gs = []
              set_deadline(max(2, left() - 3))     # 보고서 작성 시간 3분은 남긴다
              try:
                for _, r in cand.iterrows():
                    if left() < 2:
                        cut = True
                        break
                    f, px = {}, None
                    try:
                        t = yf.Ticker(r["ticker"])
                        px = t.history(period="2y", auto_adjust=False).rename(columns=str.lower)
                        q, a = t.quarterly_income_stmt, t.income_stmt
                        qe = row(q, ["Diluted EPS", "Basic EPS"])
                        if qe is None:
                            qe = row(q, ["Net Income"])
                        f["qe"] = qe
                        f["qr"] = row(q, ["Total Revenue", "Operating Revenue"])
                        ae = row(a, ["Diluted EPS", "Basic EPS"])
                        if ae is None:
                            ae = row(a, ["Net Income"])
                        f["ae"] = ae
                        i = t.info or {}
                        f["roe"] = i.get("returnOnEquity")
                        f["shares"] = i.get("floatShares") or i.get("sharesOutstanding")
                        f["inst"] = i.get("heldPercentInstitutions")
                        SEC[r["ticker"]] = i.get("sector") or ""
                        IND[r["ticker"]] = i.get("industry") or ""
                    except Exception:
                        pass
                    g = canslim(f, px, r.get("rs_pct"), REG.get(r["market"], ""))
                    g.update(name=r["name"], ticker=r["ticker"], market=r["market"],
                             last=r["last"], pivot=r["pivot"], dist=r["dist"])
                    gs.append(g)
              except Deadline:
                  cut = True
                  print("  [강제마감] 재무 조회 중단", flush=True)
              finally:
                  clear_deadline()

              if gs:
                  gdf = pd.DataFrame(gs)
                  gdf.to_csv("results/list2_canslim_full.csv", index=False, encoding="utf-8-sig")
                  l2 = gdf[gdf["verdict"] == "canslim"]
          log(f"캔슬림 통과 {len(l2)}건")

          # 섹터는 캔슬림 단계에서 수집되므로 그 뒤에 붙인다
          if len(l1):
              l1 = l1.copy()
              l1["섹터"] = l1["코드"].map(
                  lambda t: SECTOR_KR.get(SEC.get(t, ""), SEC.get(t, "") or "미분류"))
              cols = list(l1.columns)
              cols.insert(3, cols.pop(cols.index("섹터")))
              l1 = l1[cols]
              l1.to_csv("results/list1_cup.csv", index=False, encoding="utf-8-sig")
              l1[l1["막돌파"] == True].to_csv("results/list0_ath_breakout.csv",  # noqa: E712
                                             index=False, encoding="utf-8-sig")
              n_sec = int((l1["섹터"] != "미분류").sum())
              log(f"섹터 확인 {n_sec}/{len(l1)}종목")


          # --- 보고서 ----------------------------------------------------------------
          def tbl(d, cols, hdr, n=80):
              if d is None or len(d) == 0:
                  return "_해당 없음_\n"
              o = "| " + " | ".join(hdr) + " |\n|" + "|".join(["---"] * len(hdr)) + "|\n"
              for _, r in d[cols].head(n).iterrows():
                  o += "| " + " | ".join(
                      f"{r[c]:,.2f}" if isinstance(r[c], float) else str(r[c])
                      for c in cols) + " |\n"
              return o


          stamp = time.strftime("%Y-%m-%d (%a)", time.gmtime(time.time() + 32400))
          md = [f"# 컵앤핸들 리스트 — {stamp}\n", "## 시장 상황\n", "| 나라 | 국면 |", "|---|---|"]
          for nm, code, *_ in MKT:
              if code in REG:
                  md.append(f"| {nm} | {LBL[REG[code]]} |")
          md += ["", "## 스캔 결과\n", "| 나라 | 조회 | 발견 | 비고 |", "|---|---|---|---|"]
          for a, b, c, d in stats:
              md.append(f"| {a} | {b:,} | {c} | {d} |")

          fr = l1[l1["막돌파"] == True] if len(l1) else pd.DataFrame()  # noqa: E712
          NAME = {"KR": "한국", "US": "미국", "JP": "일본", "CN": "중국", "HK": "홍콩"}
          FC = ["종목명", "코드", "섹터", "현재가", "매수기준가", "돌파일",
                "돌파후일수", "돌파거래량", "현재가_최고가대비%", "컵깊이%"]
          LC = ["종목명", "코드", "섹터", "현재가", "매수기준가", "기준가까지%",
                "피봇_최고가대비%", "컵깊이%"]


          def by_country(df, cols, open_first=True, n=60):
              """나라별로 접었다 펼칠 수 있게 만든다 (제목을 누르면 열림)"""
              if df is None or len(df) == 0:
                  return ["_해당 없음_\n"]
              out, first = [], True
              for code in ["KR", "US", "JP", "CN", "HK"]:
                  g = df[df["시장"] == code] if "시장" in df.columns else df.iloc[0:0]
                  if len(g) == 0:
                      continue
                  op = " open" if (first and open_first) else ""
                  out.append(f"<details{op}>")
                  out.append(f"<summary><b>{NAME[code]} &nbsp; {len(g)}개</b></summary>\n")
                  out.append(tbl(g, cols, cols, n=n))
                  out.append("</details>\n")
                  first = False
              return out or ["_해당 없음_\n"]


          def sector_note(df):
              """나라별로 어느 섹터가 몰려 있는지 한 줄로 요약"""
              out = []
              if df is None or len(df) == 0 or "섹터" not in df.columns:
                  return ["_섹터 정보 없음_\n"]
              for code in ["KR", "US", "JP", "CN", "HK"]:
                  g = df[df["시장"] == code]
                  if len(g) == 0:
                      continue
                  vc = g["섹터"].value_counts()
                  vc = vc[vc.index != "미분류"]
                  if len(vc) == 0:
                      out.append(f"- **{NAME[code]}** ({len(g)}개) — 섹터 미확인")
                      continue
                  tot = int(vc.sum())
                  top = [f"{k} {int(v)}개({v/tot*100:.0f}%)" for k, v in vc.head(3).items()]
                  lead = vc.index[0]
                  share = vc.iloc[0] / tot
                  if share >= 0.5:
                      tail = f" → **{lead}** 쏠림"
                  elif share >= 0.3:
                      tail = f" → {lead} 우위"
                  else:
                      tail = " → 특정 섹터 쏠림 없음"
                  out.append(f"- **{NAME[code]}** ({len(g)}개) — " + ", ".join(top) + tail)
              return out


          md += ["", "\n## 섹터 흐름\n",
                 "_아래 ★ 종목들이 어느 섹터에 몰려 있는지입니다._\n"]
          md += sector_note(fr if len(fr) else
                            (l1[l1["매수권"] == True] if len(l1) else l1))  # noqa: E712
          md.append("")

          md += ["", f"\n## ★ 사상최고가 돌파 종목 {len(fr)}개\n",
                 "_컵앤핸들 완성 후 5거래일 이내 · 거래량 동반 · "
                 "손잡이 고점이 사상최고가 -10% 이내 · "
                 "현재가가 사상최고가 +5% 이내. 상장 2년 미만 제외._\n",
                 "_나라 이름을 누르면 펼쳐집니다._\n"]
          md += by_country(fr.sort_values("돌파후일수") if len(fr) else fr, FC)

          act = l1[l1["매수권"] == True] if len(l1) else pd.DataFrame()  # noqa: E712
          show = act if len(act) else l1
          md += ["", f"\n## 리스트 1 — 컵 모양 {len(l1)}개 "
                     f"(매수 기준가 근처 {len(act)}개)\n",
                 f"_전체 목록은 results/list1_cup.csv 에 있습니다._\n"]
          md += by_country(show.sort_values("기준가까지%", key=abs) if len(show) else show,
                           LC, open_first=False)

          md.append(f"\n## 리스트 2 — 캔슬림 통과 {len(l2)}개\n")
          if len(l2):
              t2 = l2.rename(columns={"name": "종목명", "ticker": "코드",
                                      "market": "시장", "last": "현재가",
                                      "pivot": "매수기준가"})
              md += by_country(t2, ["종목명", "코드", "현재가", "매수기준가",
                                    "C", "A", "N", "S", "L", "I", "M"],
                               open_first=False)
          else:
              md.append("_통과 종목 없음._ 캔슬림 전 항목 통과는 원래 드뭅니다. "
                        "하락장이면 M 규칙 때문에 전부 탈락합니다.\n")

          if cut:
              md.append("\n> ⚠ 시간 제한으로 일부만 처리했습니다.\n")
          md.append(f"\n---\n소요 {(time.time()-T0)/60:.0f}분 · 전체 목록은 results 폴더\n")
          md.append("\n※ 후보 목록이며 매수 추천이 아닙니다. 판단과 책임은 본인에게 있습니다.\n")
          # ---------------- 인쇄용 HTML (PDF 변환용) ----------------
          def h_tbl(df, cols, n=200):
              if df is None or len(df) == 0:
                  return "<p><i>해당 없음</i></p>"
              o = ["<table><tr>" + "".join(f"<th>{c}</th>" for c in cols) + "</tr>"]
              for _, r in df[cols].head(n).iterrows():
                  cells = []
                  for c in cols:
                      v = r[c]
                      v = f"{v:,.2f}" if isinstance(v, float) else str(v)
                      cells.append(f"<td>{v}</td>")
                  o.append("<tr>" + "".join(cells) + "</tr>")
              o.append("</table>")
              return "".join(o)


          def h_country(df, cols):
              if df is None or len(df) == 0:
                  return "<p><i>해당 없음</i></p>"
              out = []
              for code in ["KR", "US", "JP", "CN", "HK"]:
                  g = df[df["시장"] == code] if "시장" in df.columns else df.iloc[0:0]
                  if len(g) == 0:
                      continue
                  out.append(f"<h3>{NAME[code]} — {len(g)}개</h3>" + h_tbl(g, cols))
              return "".join(out) or "<p><i>해당 없음</i></p>"


          H = [f"""<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
          @page{{size:A4 landscape;margin:10mm}}
          body{{font-family:"Noto Sans CJK KR",sans-serif;font-size:9pt;color:#1c1b19}}
          h1{{font-size:19pt;margin:0 0 4px;border-bottom:3px solid #1c1b19;padding-bottom:6px}}
          h2{{font-size:13pt;margin:18px 0 6px;background:#1c1b19;color:#fff;padding:4px 9px}}
          h3{{font-size:11pt;margin:12px 0 4px}}
          table{{width:100%;border-collapse:collapse;font-size:8.4pt;margin-bottom:10px}}
          th,td{{border:1px solid #ddd9d2;padding:3.5px 6px;text-align:left}}
          th{{background:#f5f3ef}}
          .note{{font-size:8.4pt;color:#5f5e5a;margin:4px 0 8px}}
          .ft{{border-top:1px solid #d8d6d1;margin-top:12px;padding-top:6px;
               font-size:7.8pt;color:#888780}}
          </style></head><body>
          <h1>컵앤핸들 리스트 — {stamp}</h1>"""]

          H.append("<h2>시장 상황</h2><table><tr><th>나라</th><th>국면</th></tr>")
          for nm_, code_, *_ in MKT:
              if code_ in REG:
                  H.append(f"<tr><td>{nm_}</td><td>{LBL[REG[code_]]}</td></tr>")
          H.append("</table>")

          H.append("<h2>스캔 결과</h2><table><tr><th>나라</th><th>조회</th>"
                   "<th>발견</th><th>비고</th></tr>")
          for a_, b_, c_, d_ in stats:
              H.append(f"<tr><td>{a_}</td><td>{b_:,}</td><td>{c_}</td><td>{d_}</td></tr>")
          H.append("</table>")

          H.append("<h2>섹터 흐름</h2><ul>")
          for line in sector_note(fr if len(fr) else act):
              H.append("<li>" + line.lstrip("- ").replace("**", "") + "</li>")
          H.append("</ul>")

          H.append(f"<h2>★ 사상최고가 돌파 종목 {len(fr)}개</h2>")
          H.append('<p class="note">컵앤핸들 완성 후 5거래일 이내 · 거래량 동반 · '
                   '손잡이 고점이 사상최고가 −10% 이내 · 현재가 사상최고가 +5% 이내.</p>')
          H.append(h_country(fr.sort_values("돌파후일수") if len(fr) else fr, FC))

          H.append(f"<h2>리스트 1 — 컵 모양 {len(l1)}개</h2>")
          H.append(h_country(show.sort_values("기준가까지%", key=abs)
                             if len(show) else show, LC))

          H.append(f"<h2>리스트 2 — 캔슬림 통과 {len(l2)}개</h2>")
          if len(l2):
              t2h = l2.rename(columns={"name": "종목명", "ticker": "코드",
                                       "market": "시장", "last": "현재가",
                                       "pivot": "매수기준가"})
              H.append(h_country(t2h, ["종목명", "코드", "현재가", "매수기준가",
                                       "C", "A", "N", "S", "L", "I", "M"]))
          else:
              H.append("<p><i>통과 종목 없음</i></p>")

          H.append('<div class="ft">후보 목록이며 매수 추천이 아닙니다. '
                   '판단과 책임은 본인에게 있습니다.</div></body></html>')
          open("report.html", "w", encoding="utf-8").write("".join(H))

          # ---------------- 이슈 하단 PDF 링크 ----------------
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          DATE = time.strftime("%Y-%m-%d", time.gmtime(time.time() + 32400))
          PDFN = f"report_{DATE}.pdf"
          if REPO:
              view = f"https://github.com/{REPO}/blob/main/results/{PDFN}"
              save = f"https://github.com/{REPO}/raw/main/results/{PDFN}"
              md.append("\n---\n")
              md.append(f"### 📄 [PDF로 보기]({view})  ·  [⬇️ PDF 저장]({save})\n")
              md.append("_'PDF로 보기'는 화면에서 바로 열리고, "
                        "'PDF 저장'은 파일로 내려받습니다._\n")
          open("pdfname.txt", "w").write(PDFN)

          body = "\n".join(md)
          if len(body) > 60000:
              body = body[:59000] + "\n\n> 내용이 길어 잘렸습니다. 전체는 results 폴더의 csv 참고.\n"
          open("summary.md", "w", encoding="utf-8").write(body)
          log(f"보고서 완료 ({len(body):,}자)")
          PYTHON_EOF

      - name: 스캔
        timeout-minutes: 100
        env:
          TIME_BUDGET_MIN: "88"
          TOP_FUND: "250"
        run: python scan.py

      - name: PDF 만들기
        if: always()
        run: |
          if [ -f report.html ]; then
            NAME=$(cat pdfname.txt 2>/dev/null || echo report.pdf)
            mkdir -p results
            wkhtmltopdf --enable-local-file-access --print-media-type \
              --page-size A4 --orientation Landscape -q \
              report.html "results/$NAME" || echo "PDF 변환 실패"
            ls -la "results/$NAME" || true
          fi

      - name: 파일 저장
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A results summary.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "결과 $(TZ=Asia/Seoul date '+%m/%d')"
          git push || true

      - name: 결과 올리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f summary.md ]; then
            gh issue create --title "컵앤핸들 $(TZ=Asia/Seoul date '+%m/%d')" --body-file summary.md --repo "${{ github.repository }}"
          else
            gh issue create --title "컵앤핸들 $(TZ=Asia/Seoul date '+%m/%d') - 실패" --body "스캔이 보고서를 만들지 못했습니다. Actions 로그를 확인하세요." --repo "${{ github.repository }}"
          fi
